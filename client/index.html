<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe Online</title>
  <meta name="description" content="Real-time two-player Tic Tac Toe. Create a room, share the code, play." />
  <meta name="theme-color" content="#eef2f1" />
  <meta name="color-scheme" content="light dark" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("ttt-theme");
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) { }
    })();
  </script>
  <meta property="og:title" content="Tic Tac Toe Online" />
  <meta property="og:description" content="Real-time two-player Tic Tac Toe. Create a room, share the code, play." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
