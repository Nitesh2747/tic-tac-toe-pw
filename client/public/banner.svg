<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Tic Tac Toe Online" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- board -->
  <g transform="translate(790 50)">
    <g stroke="#475569" stroke-width="8" stroke-linecap="round">
      <path d="M100 0v300M200 0v300M0 100h300M0 200h300"/>
    </g>
    <!-- X marks -->
    <g stroke="#fb7185" stroke-width="12" stroke-linecap="round">
      <path d="M25 25l50 50M75 25l-50 50"/>
      <path d="M125 125l50 50M175 125l-50 50"/>
      <path d="M225 225l50 50M275 225l-50 50"/>
    </g>
    <!-- O marks -->
    <g fill="none" stroke="#22d3ee" stroke-width="12">
      <circle cx="150" cy="50" r="27"/>
      <circle cx="50" cy="150" r="27"/>
      <circle cx="250" cy="150" r="27"/>
    </g>
    <!-- winning line -->
    <path d="M12 12L288 288" stroke="url(#win)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="70" y="190" font-size="88" font-weight="800" fill="#f8fafc">Tic Tac Toe</text>
    <text x="70" y="260" font-size="36" font-weight="500" fill="#94a3b8">Play online. Challenge a friend.</text>
  </g>
  <g>
    <rect x="70" y="295" width="190" height="8" rx="4" fill="#fb7185"/>
    <rect x="270" y="295" width="60" height="8" rx="4" fill="#22d3ee"/>
  </g>
</svg>
